[tool.coverage.run]
omit = [
    "main.py",
    "app_web.py",
    "tests/*",
    "servicos/interfaces.py",
    "repositorios/interfaces.py"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "modelos", "repositorios", "servicos"]
